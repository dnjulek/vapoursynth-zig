name: Test with VapourSynth

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Python dependencies
      run: pip install VapourSynth

    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        use-cache: false

    - name: zig test
      run: zig build test

    - name: build example plugin
      run: cd examples/ && zig build

    - name: build test plugin
      run: cd test/ && zig build

    - name: Run test.vpy
      run: cd test/ && vspipe -p ./tst.vpy .
